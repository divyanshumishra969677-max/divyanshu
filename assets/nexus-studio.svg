<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="statueLight" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a4556" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marbleGrad" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#d4d8df"/>
      <stop offset="65%" stop-color="#7a8494"/>
      <stop offset="100%" stop-color="#1f2530"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="380" fill="url(#bgGrad1)"/>
  <rect width="600" height="380" fill="url(#statueLight)"/>

  <!-- Subtle Web Frame UI -->
  <line x1="24" y1="42" x2="576" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="42" cy="28" r="3.5" fill="#e8dccb" opacity="0.6"/>
  <rect x="56" y="25" width="40" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Left Editorial Content -->
  <text x="44" y="96" fill="#e8dccb" font-family="'Cinzel', 'Playfair Display', serif" font-size="21" font-weight="700" letter-spacing="2">WHERE IDEAS</text>
  <text x="44" y="122" fill="#e8dccb" font-family="'Cinzel', 'Playfair Display', serif" font-size="21" font-weight="700" letter-spacing="2">BECOME ICONIC</text>
  <rect x="44" y="146" width="160" height="1" fill="rgba(232,220,203,0.3)"/>
  <text x="44" y="174" fill="#8896a8" font-family="sans-serif" font-size="10.5" letter-spacing="1">AWARD WINNING DIGITAL AGENCY</text>

  <!-- CTA pill -->
  <rect x="44" y="210" width="94" height="26" rx="13" fill="none" stroke="#e8dccb" stroke-width="1"/>
  <text x="64" y="227" fill="#e8dccb" font-family="sans-serif" font-size="9.5" letter-spacing="1.5">EXPLORE</text>

  <!-- Classical Marble Bust Silhouette & Art Representation -->
  <g transform="translate(360, 60)" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.8))">
    <!-- Pedestal / Base -->
    <path d="M40 260 L140 260 L125 240 L55 240 Z" fill="#2a3340"/>
    <path d="M55 240 L125 240 L115 220 L65 220 Z" fill="#3a4556"/>
    <!-- Torso -->
    <path d="M20 220 Q50 180 65 140 Q90 140 120 180 Q150 200 160 220 Z" fill="url(#marbleGrad)"/>
    <!-- Neck -->
    <path d="M72 145 Q88 120 90 95 Q108 120 114 145 Z" fill="#b0b8c6"/>
    <!-- Head / Face Profile -->
    <path d="M90 60 Q120 50 125 80 Q128 100 118 115 Q105 125 90 125 Q75 120 70 95 Q70 70 90 60 Z" fill="url(#marbleGrad)"/>
    <!-- Curly Hair Classical Crown -->
    <path d="M65 65 Q70 40 90 35 Q115 32 135 50 Q145 70 135 90 Q125 75 110 70 Q95 65 80 75 Z" fill="#d9dfe8"/>
    <!-- Shading & Details -->
    <ellipse cx="102" cy="85" rx="5" ry="3" fill="#4a5568"/>
    <path d="M106 90 Q112 98 108 102" stroke="#4a5568" stroke-width="2" fill="none"/>
    <path d="M96 110 Q104 114 110 110" stroke="#4a5568" stroke-width="2" fill="none"/>
  </g>
</svg>
