<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="fintechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="50%" stop-color="#121626"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#635bff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090b12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4252"/>
      <stop offset="100%" stop-color="#1e222d"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#fintechBg)"/>
  <rect width="600" height="380" fill="url(#purpleGlow)"/>

  <!-- Top bar -->
  <line x1="24" y1="42" x2="576" y2="42" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="42" cy="28" r="3.5" fill="#635bff"/>
  <text x="56" y="32" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">PAYERA</text>

  <!-- Left Content -->
  <text x="44" y="105" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700">Smart banking</text>
  <text x="44" y="132" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700">for modern life.</text>
  <text x="44" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11">Next-gen global financial infrastructure.</text>

  <!-- Input & Button Mock -->
  <rect x="44" y="200" width="130" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="58" y="218" fill="#64748b" font-family="sans-serif" font-size="9.5">Enter your email</text>
  <rect x="180" y="200" width="36" height="28" rx="14" fill="#635bff"/>
  <path d="M194 214 L202 214 M198 210 L202 214 L198 218" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Floating Phone & Glowing Cards -->
  <g transform="translate(350, 40) rotate(-6)">
    <!-- Phone Body -->
    <rect x="20" y="20" width="160" height="280" rx="24" fill="#111522" stroke="url(#phoneBorder)" stroke-width="3" filter="drop-shadow(0 15px 35px rgba(0,0,0,0.8))"/>
    <rect x="65" y="28" width="70" height="12" rx="6" fill="#000000"/>
    
    <!-- Phone Screen Content -->
    <!-- Mini Balance -->
    <text x="42" y="75" fill="#94a3b8" font-family="sans-serif" font-size="9">Total Balance</text>
    <text x="42" y="98" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">$48,290.50</text>
    
    <!-- Glowing Credit Card Inside Phone -->
    <rect x="36" y="115" width="128" height="78" rx="10" fill="url(#cardGrad)" filter="drop-shadow(0 4px 12px rgba(99,91,255,0.5))"/>
    <circle cx="56" cy="135" r="7" fill="rgba(255,255,255,0.3)"/>
    <circle cx="66" cy="135" r="7" fill="rgba(255,255,255,0.5)"/>
    <text x="52" y="176" fill="#ffffff" font-family="monospace" font-size="8" letter-spacing="1.5">•••• 8924</text>
    <text x="135" y="176" fill="#e0e7ff" font-family="sans-serif" font-size="7" font-weight="bold">VISA</text>

    <!-- Activity Bars -->
    <rect x="36" y="210" width="128" height="24" rx="6" fill="rgba(255,255,255,0.05)"/>
    <circle cx="50" cy="222" r="5" fill="#10b981"/>
    <text x="62" y="225" fill="#cbd5e1" font-family="sans-serif" font-size="8">Stripe Payout</text>
    <text x="135" y="225" fill="#10b981" font-family="sans-serif" font-size="8">+$2,400</text>
  </g>

  <!-- Glowing Star Particle -->
  <path d="M490 120 Q500 120 500 110 Q500 120 510 120 Q500 120 500 130 Q500 120 490 120 Z" fill="#ffffff" filter="drop-shadow(0 0 6px #635bff)"/>
</svg>
